<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" fill="#f7f7f7"/><text x="40" y="50" font-family="sans-serif" font-size="28" font-weight="bold">Custom PCB Status</text><rect x="80" y="110" width="840" height="300" rx="18" fill="#d9e8f5" stroke="#35648a" stroke-width="4"/><text x="500" y="180" text-anchor="middle" font-family="sans-serif" font-size="28">No custom PCB in this revision</text><text x="500" y="235" text-anchor="middle" font-family="sans-serif" font-size="20">The design integrates purchased Raspberry Pi, charger/BMS, boost,</text><text x="500" y="270" text-anchor="middle" font-family="sans-serif" font-size="20">audio amplifier, camera, display, and microphone modules.</text><text x="500" y="330" text-anchor="middle" font-family="sans-serif" font-size="20">Therefore there are no KiCad/EasyEDA sources or project-specific gerbers.</text><text x="500" y="370" text-anchor="middle" font-family="sans-serif" font-size="18">If a custom power/audio PCB is added later, create pcb/gerbers.zip and commit the sources.</text></svg>
